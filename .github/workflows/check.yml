name: Check portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/github-projects.test.mjs
      - run: npm run build
      - run: node --check script.js
      - run: node --check server/worker.js
