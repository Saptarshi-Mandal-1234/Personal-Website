<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MediVault frontend landing screen</title>
  <desc id="desc">A dark MediVault interface for decentralized medical records, with patient, doctor, and login actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="blue"><stop stop-color="#3b82f6" stop-opacity=".25"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="patient" x1="0" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="doctor" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/><circle cx="20" cy="35" r="300" fill="url(#blue)"/><circle cx="1260" cy="700" r="300" fill="url(#cyan)"/>
  <g text-anchor="middle" font-family="Arial, sans-serif"><text x="640" y="307" fill="white" font-size="64" font-weight="700">MediVault 🔐</text><text x="640" y="357" fill="#9ca3af" font-size="20">Secure, decentralized medical records powered by blockchain &amp; zero-knowledge</text><text x="640" y="385" fill="#9ca3af" font-size="20">proofs.</text></g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle"><rect x="401" y="424" width="180" height="52" rx="12" fill="url(#patient)"/><text x="491" y="456" fill="white">Register as Patient</text><rect x="596" y="424" width="180" height="52" rx="12" fill="url(#doctor)"/><text x="686" y="456" fill="white">Register as Doctor</text><rect x="790" y="424" width="90" height="52" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".2"/><text x="835" y="456" fill="white">Login</text></g>
</svg>
